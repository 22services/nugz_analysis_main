# Deploiement sur le VPS (Ubuntu 24.04, 8 vCPU, 15 Go RAM, pas de GPU).
#
# Le VPS fait deja tourner Coolify + Traefik + l'infra 22edges. Ce fichier
# se deploie comme une application Coolify : Traefik assure deja le routage
# et TLS, on ne republie donc pas de ports sur l'hote.
#
# Note d'architecture (arbitrage avec Hermes) : la base de donnees marche
# a SON PROPRE conteneur et ne partage pas le PG15 de Coolify. Un backfill
# massif d'historique OHLCV sur la base de Coolify ferait tomber la
# plateforme de deploiement elle-meme.

services:
  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      TZ: UTC
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: 2G

  # Donnees de marche reelles via OpenBB (service a part : dependances
  # incompatibles avec celles de l'API du comite).
  terminal:
    build:
      context: ./terminal
    restart: unless-stopped
    environment:
      TZ: UTC
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M

  web:
    build:
      context: ./frontend
      args:
        # Doit pointer vers le domaine public de l'API : cette valeur est
        # inlinee dans le bundle client au moment du build.
        NEXT_PUBLIC_API_BASE: ${PUBLIC_API_BASE:-http://api:8000}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

