# Deploiement sur le VPS (Ubuntu 24.04, 8 vCPU, 15 Go RAM, pas de GPU).
#
# Deux services seulement :
#   api : OpenBB + moteur de decision (VWAP, profil de volume, ATR, structure)
#         + comite toutes les 15 minutes + journal persistant
#   web : le dashboard Next.js (3 onglets)

services:
  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      TZ: UTC
      DECISION_SYMBOL: ${DECISION_SYMBOL:-GC=F}
      RISK_PER_TRADE_USD: ${RISK_PER_TRADE_USD:-500}
      DATA_DELAY_S: ${DATA_DELAY_S:-720}
      REPLAY_DAYS: ${REPLAY_DAYS:-10}
    volumes:
      - journal:/data
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  web:
    build:
      context: ./frontend
      args:
        # Inline dans le bundle client au moment du build.
        NEXT_PUBLIC_API_BASE: ${PUBLIC_API_BASE:-http://api:8000}
    restart: unless-stopped
    depends_on:
      - api
    expose:
      - "3000"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

volumes:
  journal:
