# Surcharge de production pour nugz.22edges.com.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Le proxy Traefik de Coolify decouvre les conteneurs par leurs labels sur le
# reseau `coolify`. Un seul domaine : /api/* va au backend (OpenBB + comite),
# le reste au front, ce qui evite tout CORS cote navigateur.
#
# Apres la v2 (fusion des services), redeployer avec --remove-orphans pour
# supprimer l'ancien conteneur `terminal` :
#   docker compose -p nugz -f docker-compose.yml -f docker-compose.prod.yml up -d --build --remove-orphans

services:
  api:
    # Un seul worker : le planificateur des 15 minutes doit tourner une seule
    # fois, sinon chaque barre serait decidee deux fois.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    networks: [default, coolify]
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.nugz-api.rule=Host(`nugz.22edges.com`) && PathPrefix(`/api`)
      - traefik.http.routers.nugz-api.entrypoints=https
      - traefik.http.routers.nugz-api.tls=true
      - traefik.http.routers.nugz-api.tls.certresolver=letsencrypt
      - traefik.http.routers.nugz-api.priority=100
      - traefik.http.services.nugz-api.loadbalancer.server.port=8000

  web:
    build:
      args:
        NEXT_PUBLIC_API_BASE: https://nugz.22edges.com
    networks: [default, coolify]
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.nugz-web.rule=Host(`nugz.22edges.com`)
      - traefik.http.routers.nugz-web.entrypoints=https
      - traefik.http.routers.nugz-web.tls=true
      - traefik.http.routers.nugz-web.tls.certresolver=letsencrypt
      - traefik.http.routers.nugz-web.priority=10
      - traefik.http.services.nugz-web.loadbalancer.server.port=3000
      - traefik.http.routers.nugz-http.rule=Host(`nugz.22edges.com`)
      - traefik.http.routers.nugz-http.entrypoints=http
      - traefik.http.routers.nugz-http.middlewares=nugz-https
      - traefik.http.middlewares.nugz-https.redirectscheme.scheme=https

networks:
  coolify:
    external: true
